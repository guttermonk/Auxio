name: Android Build

on:
  workflow_dispatch:
    inputs:
      artifactName:
        description: Artifact name (e.g. Auxio_4.0.11.apk)
        type: string
        required: true
      tagName:
        description: Tag name (e.g. v4.0.11)
        type: string
        required: true
      prerelease:
        description: Prerelease
        type: boolean
        required: true
      releaseName:
        description: Release name (e.g. Auxio 4.0.11)
        type: string
        required: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Install ninja-build
        run: sudo apt-get install -y ninja-build
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Clone submodules
        run: git submodule update --init --recursive --remote
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK with Gradle
        run: ./gradlew app:packageDebug
      - name: Rename artifact
        env:
          ARTIFACT_NAME: ${{ github.event.inputs.artifactName }}
        run: mv ./app/build/outputs/apk/debug/app-debug.apk "$ARTIFACT_NAME"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ github.event.inputs.artifactName }}

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts/
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tagName }}
          name: ${{ github.event.inputs.releaseName }}
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: true
          files: artifacts/${{ github.event.inputs.artifactName }}
