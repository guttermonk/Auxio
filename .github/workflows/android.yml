name: Android Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 4.0.41)
        type: string
        required: true
      prerelease:
        description: Prerelease
        type: boolean
        required: true
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Derive versionCode from version
        id: derive
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version '$VERSION' must be MAJOR.MINOR.PATCH (e.g. 4.0.41)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          echo "versionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
      - name: Install ninja-build
        run: sudo apt-get install -y ninja-build
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Clone submodules
        run: git submodule update --init --recursive --remote
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Write keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=../keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK with Gradle
        run: ./gradlew app:assembleRelease -PversionName=${{ github.event.inputs.version }} -PversionCode=${{ steps.derive.outputs.versionCode }}
      - name: Rename artifact
        run: mv ./app/build/outputs/apk/release/app-release.apk "Auxio-${{ github.event.inputs.version }}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: Auxio-${{ github.event.inputs.version }}.apk

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: artifacts/
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Auxio ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: true
          files: artifacts/Auxio-${{ github.event.inputs.version }}.apk
